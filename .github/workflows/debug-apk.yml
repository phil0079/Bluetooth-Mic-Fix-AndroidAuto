name: Diagnostics debug APK
on:
  push:
    branches: [main, diagnostics-first]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
      - name: Install Android SDK
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - name: Build, test, and lint passive diagnostics
        run: bash gradlew :diagnostics:testDebugUnitTest :diagnostics:lintDebug :diagnostics:assembleDebug --stacktrace
      - name: APK checksum
        run: sha256sum diagnostics/build/outputs/apk/debug/diagnostics-debug.apk > diagnostics/build/outputs/apk/debug/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: bt-mic-diagnostics-debug
          path: |
            diagnostics/build/outputs/apk/debug/diagnostics-debug.apk
            diagnostics/build/outputs/apk/debug/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
